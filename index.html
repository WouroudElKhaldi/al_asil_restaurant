<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مطعم الأسيل</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="light">
    <header class="header">
      <div class="overlay">
        <h1>مطعم الأسيل</h1>
        <p>فلافل • حمص • معجنات</p>
        <button
          class="btn btn-sm toggle-theme"
          onclick="toggleTheme()"
        ></button>
      </div>
    </header>

    <div class="container my-4">
      <!-- Category buttons -->
      <div id="categoryButtons" class="mb-4 text-center"></div>

      <!-- Menu items -->
      <div id="menu"></div>
    </div>

    <!-- CART TOGGLE BUTTON -->
    <button id="cartToggle">🛒 السلة</button>

    <!-- CART PANEL -->
    <div class="cart-panel">
      <h4 class="mb-3">🛒 سلة الطلب</h4>

      <div id="cartItems"></div>

      <div class="mt-3">
        <strong>المجموع:</strong>
        <span id="total">0</span> ل.ل
      </div>

      <button class="whatsapp mt-3" onclick="sendWhatsApp()">
        إرسال الطلب عبر واتساب
      </button>
      <button id="closeCart" class="btn btn-secondary w-full mt-2">
        إغلاق
      </button>
    </div>

    <div id="toast" class="toast-notification">
      تمت إضافة المنتج إلى السلة 🛒
    </div>

    <script src="script.js"></script>
  </body>
</html>
