<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>مطعم الأصيل</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="light">
    <header class="header">
      <div class="overlay">
        <h1>مطعم الأسيل</h1>
        <p>فلافل • حمص • معجنات</p>
        <button class="btn btn-sm toggle-theme" onclick="toggleTheme()">
          تبديل الوضع
        </button>
      </div>
    </header>

    <div class="container my-4">
      <!-- Category buttons -->
      <div id="categoryButtons" class="mb-4 text-center"></div>

      <!-- Menu items -->
      <div id="menu"></div>
    </div>

    <div class="cart">
      <h5 class="mb-3">🛒 السلة</h5>
      <div id="cartItems"></div>
      <hr />
      <div class="d-flex justify-content-between">
        <strong>المجموع</strong>
        <strong><span id="total">0</span> ل.ل</strong>
      </div>
      <button class="btn whatsapp w-100 mt-3" onclick="sendWhatsApp()">
        اطلب عبر واتساب
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
